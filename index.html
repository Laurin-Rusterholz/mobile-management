  else if (_sheetMode === 'note') {
    const notebooks = getNotebooks();
    const currentNbId = existing?.notebookId || (_selectedNotebook && _selectedNotebook !== 'inbox' && _selectedNotebook !== 'all' ? _selectedNotebook : '');
    const nbOptions = '<option value="">📥 Inbox (kein Notizbuch)</option>' + 
      notebooks.map(nb => `<option value="${nb.id}" ${nb.id===currentNbId?'selected':''}>📓 ${escHTML(nb.title)}</option>`).join('');
    title.textContent = existing ? 'Notiz bearbeiten' : 'Neue Notiz';
    
    // Wenn vorhandene Notiz bearbeitet wird mit langem Inhalt → automatisch Vollbild
    if (existing && (existing.content || '').length > 200) {
      _sheetSize = 'full';
    }
    
    const filesHtml = renderFilesBlock(existing?.files);
    html = `
      <div class="sheet-field">
        <label class="sheet-label">Titel</label>
        <input type="text" class="sheet-input" id="fTitle" placeholder="Optionaler Titel" value="${escHTML(existing?.title||'')}" />
      </div>
      <div class="sheet-field">
        <label class="sheet-label">Notiz *</label>
        <textarea class="sheet-textarea tall" id="fContent" placeholder="Schreib deine Notiz…" style="${_sheetSize==='full'?'min-height:60vh':''}" autofocus>${escHTML(existing?.content||'')}</textarea>
      </div>
      <div class="sheet-field">
        <label class="sheet-label">Notizbuch</label>
        <select class="sheet-select" id="fNotebook">${nbOptions}</select>
      </div>
      ${filesHtml ? `<div class="sheet-field"><label class="sheet-label">Anhänge</label>${filesHtml}</div>` : ''}`;
  }
  else if (_sheetMode === 'idea') {
    title.textContent = existing ? 'Idee bearbeiten' : 'Neue Idee';
    html = `
      <div class="sheet-field">
        <label class="sheet-label">Titel</label>
        <input type="text" class="sheet-input" id="fTitle" placeholder="Kurzer Titel" value="${escHTML(existing?.title||'')}" />
      </div>
      <div class="sheet-field">
        <label class="sheet-label">Idee *</label>
        <textarea class="sheet-textarea tall" id="fText" placeholder="Beschreib deine Idee…" autofocus>${escHTML(existing?.text||'')}</textarea>
      </div>
      <div class="sheet-field">
        <label class="sheet-label">Tags (komma-separiert)</label>
        <input type="text" class="sheet-input" id="fTags" placeholder="z.B. produkt, marketing" value="${escHTML(Array.isArray(existing?.tags) ? existing.tags.join(', ') : '')}" />
      </div>`;
  }
  
  body.innerHTML = html;
  
  // Größe anwenden (kann durch _sheetMode 'note' auf 'full' gewechselt sein)
  sheet.classList.toggle('full', _sheetSize === 'full');
  const toggleBtn = document.getElementById('sheetToggle');
  if (toggleBtn) {
    toggleBtn.classList.toggle('active', _sheetSize === 'full');
    toggleBtn.textContent = _sheetSize === 'full' ? '⤡' : '⤢';
  }
  
  overlay.classList.add('open');
  sheet.classList.add('open');
  setTimeout(() => {
    const auto = body.querySelector('[autofocus]');
    if (auto) auto.focus();
  }, 350);
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet').classList.remove('full');
  document.getElementById('sheetOverlay').classList.remove('open');
  _sheetMode = null;
  _sheetCtx = {};
  _sheetSize = 'half';
}

async function submitSheet() {
  // Custom-Sheet (Passwords, Purchase Decisions) hat eigenen Submit-Handler
  if (typeof _customSheetSubmit === 'function') {
    const ok = _customSheetSubmit();
    if (ok !== false) closeSheet();
    return;
  }
  if (!_sheetMode) return;
  const editId = _sheetCtx.editId;
  
  if (_sheetMode === 'task') {
    const t = document.getElementById('fTitle').value.trim();
    if (!t) { toast('Titel ist Pflicht', 'error'); return; }
    const desc = document.getElementById('fDesc').value.trim();
    const dueRaw = document.getElementById('fDue').value;
    const due = dueRaw || null;
    
    if (editId) {
      await performOp({ type: 'update-task', payload: { id: editId, title: t, description: desc, dueDate: due } });
      toast('Aufgabe aktualisiert', 'ok');
    } else {
      const now = new Date().toISOString();
      await performOp({ type: 'add-task', payload: {
        id: newId('task'), title: t, description: desc,
        status: 'todo', priority: null, dueDate: due,
        createdAt: now, updatedAt: now, archived: false, deleted: false,
        source: 'mobile',
      }});
      toast('Aufgabe erstellt', 'ok');
    }
  }
  else if (_sheetMode === 'note') {
    const titleVal = document.getElementById('fTitle').value.trim();
    const content = document.getElementById('fContent').value.trim();
    if (!content) { toast('Notiz darf nicht leer sein', 'error'); return; }
    const nbVal = document.getElementById('fNotebook').value;
    const finalTitle = titleVal || content.split('\n')[0].slice(0, 60);
    
    if (editId) {
      await performOp({ type: 'update-note', payload: { id: editId, title: finalTitle, content, notebookId: nbVal || null } });
      toast('Notiz aktualisiert', 'ok');
    } else {
      const now = new Date().toISOString();
      await performOp({ type: 'add-note', payload: {
        id: newId('note'), title: finalTitle, content,
        notebookId: nbVal || null,
        createdAt: now, updatedAt: now, archived: false, deleted: false,
        source: 'mobile',
      }});
      toast(nbVal ? 'Notiz gespeichert' : 'Notiz in Inbox gespeichert', 'ok');
    }
  }
  else if (_sheetMode === 'idea') {
    const titleVal = document.getElementById('fTitle').value.trim();
    const text = document.getElementById('fText').value.trim();
    if (!text) { toast('Idee darf nicht leer sein', 'error'); return; }
    const tagsRaw = document.getElementById('fTags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
    const finalTitle = titleVal || text.split('\n')[0].slice(0, 60);
    
    if (editId) {
      await performOp({ type: 'update-idea', payload: { id: editId, title: finalTitle, text, tags } });
      toast('Idee aktualisiert', 'ok');
    } else {
      const now = new Date().toISOString();
      await performOp({ type: 'add-idea', payload: {
        id: newId('idea'), title: finalTitle, text, tags,
        status: 'neu', createdAt: now, updatedAt: now,
      }});
      toast('Idee gespeichert', 'ok');
    }
  }
  closeSheet();
}

let _toastTimer = null;
function toast(msg, kind = '') {
  const el = document.getElementById('toast');

  el.className = 'toast show ' + kind;
  if (_toastTimer) clearTimeout(_toastTimer);

}

let _ptr = { startY: 0, pulling: false };
const main = document.getElementById('main');
main.addEventListener('touchstart', e => {
  if (main.scrollTop === 0) { _ptr.startY = e.touches[0].clientY; _ptr.pulling = false; }
  else _ptr.startY = -1;
}, { passive: true });
main.addEventListener('touchmove', e => {
  if (_ptr.startY < 0) return;
  const delta = e.touches[0].clientY - _ptr.startY;
  if (delta > 60 && !_ptr.pulling) { _ptr.pulling = true; main.classList.add('pulling'); }
}, { passive: true });
main.addEventListener('touchend', e => {
  if (_ptr.pulling) pullData();
  main.classList.remove('pulling');
  _ptr.pulling = false; _ptr.startY = 0;
});

      render();
    } catch(_) {}
  }
  
  await pullData();
}

function wmFormatMs(ms) {
  if (ms < 0) ms = 0;
  const total = Math.ceil(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function wmFormatHumanMin(min) {
  if (min < 60) return min + ' Min';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? (h + 'h ' + m + 'min') : (h + 'h');
}

function wmTodayStats() {
  const today = todayYmd();
  const sessions = wmGetSessions().filter(s => s.dateYmd === today);
  const totalMin = Math.round(sessions.reduce((sum, s) => sum + (s.actualMs || 0), 0) / 60000);
  const completed = sessions.filter(s => s.completed).length;
  return { count: sessions.length, completed, totalMin, sessions };
}

function wmWeekStats() {
  const sessions = wmGetSessions();
  const cutoff = Date.now() - 7 * 86400000;
  const recent = sessions.filter(s => s.endedAt && new Date(s.endedAt).getTime() > cutoff);
  const totalMin = Math.round(recent.reduce((sum, s) => sum + (s.actualMs || 0), 0) / 60000);
  return { count: recent.length, totalMin };
}

function renderWorkmode() {
  // Wenn gerade eine Session läuft → Fokus direkt zeigen + Konfig sperren
  if (_wmActive) {
    setTimeout(() => wmShowFocus(), 50);
  }

  const today = wmTodayStats();
  const week = wmWeekStats();
  const tasks = getTasks().filter(t => t.status !== 'done').slice(0, 50);

  const durations = [15, 25, 45, 60, 90, 120];
  const isCustom = !durations.includes(_wmConfig.durationMin);

  const durHtml = durations.map(d => {
    const label = d === 25 ? 'Pomodoro' : d === 45 ? 'Tiefe Arbeit' : d === 60 ? 'Stunde' : d === 90 ? 'Flow' : d === 120 ? 'Marathon' : 'Kurz';
    const active = !isCustom && _wmConfig.durationMin === d;
    return `<button class="wm-duration-chip ${active ? 'active' : ''}" onclick="wmSetDuration(${d})">
      <div class="wm-duration-chip-mins">${d}</div>
      <div class="wm-duration-chip-label">${label}</div>
    </button>`;
  }).join('');

  const taskOpts = ['<option value="">— Kein spezifischer Task —</option>'].concat(
    tasks.map(t => {
      const sel = _wmConfig.taskId === t.id ? 'selected' : '';
      return `<option value="${escHTML(t.id)}" ${sel}>${escHTML((t.title || 'Unbenannt').slice(0, 60))}</option>`;
    })
  ).join('');

  const historyHtml = today.sessions.length === 0
    ? `<div class="empty" style="padding:30px 16px"><div class="empty-sub">Noch keine Sessions heute.</div></div>`
    : today.sessions.slice().reverse().map(s => {
        const startTime = s.startedAt ? new Date(s.startedAt).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : '—';
        const actualMin = Math.round((s.actualMs || 0) / 60000);
        const targetMin = Math.round((s.plannedMs || 0) / 60000);
        const sub = `${actualMin} / ${targetMin} Min${s.taskTitle ? ' · ' + escHTML(s.taskTitle.slice(0, 40)) : ''}`;
        return `<div class="wm-history-row">
          <div class="wm-history-time">${startTime}</div>
          <div class="wm-history-meta">
            <div class="wm-history-name">${escHTML(s.sessionName || 'Deep Work')}</div>
            <div class="wm-history-sub">${sub}</div>
          </div>
          <div class="wm-history-completed">${s.completed ? '✓' : '⏸'}</div>
        </div>`;
      }).join('');

  return `
    <div class="wm-hero">
      <div class="wm-hero-title">⚡ Workmode</div>
      <div class="wm-hero-h1">Deep Work starten</div>
      <div class="wm-hero-sub">Wähle eine Dauer, optional einen Task, und tauche in fokussierte Arbeit ein. Die Zeit wird automatisch im Quantus-Zeit-Tracker als "Deep Work" erfasst.</div>
    </div>

    <div class="wm-history-stat">
      <div class="wm-stat-card">
        <div class="wm-stat-num">${today.count}</div>
        <div class="wm-stat-label">Heute</div>
      </div>
      <div class="wm-stat-card">
        <div class="wm-stat-num">${wmFormatHumanMin(today.totalMin)}</div>
        <div class="wm-stat-label">Fokus heute</div>
      </div>
      <div class="wm-stat-card">
        <div class="wm-stat-num">${week.count}</div>
        <div class="wm-stat-label">7 Tage</div>
      </div>
    </div>

    <div class="wm-section-label">Dauer</div>
    <div class="wm-duration-grid">${durHtml}</div>
    <div class="wm-custom-row">
      <label>Eigene</label>
      <input type="number" min="1" max="240" id="wmCustomInput" value="${isCustom ? _wmConfig.durationMin : ''}" placeholder="${_wmConfig.durationMin}" onchange="wmSetCustomDuration(this.value)" />
      <span class="wm-custom-unit">Min</span>
    </div>

    <div class="wm-section-label">Was bearbeitest du?</div>
    <select class="wm-task-select" onchange="wmSetTask(this.value)">${taskOpts}</select>

    <div class="wm-section-label">Session-Name (optional)</div>
    <input type="text" class="wm-task-select" id="wmNameInput" placeholder="z.B. Bachelorarbeit Kapitel 3" value="${escHTML(_wmConfig.sessionName || '')}" oninput="_wmConfig.sessionName = this.value; wmSavePrefs()" style="padding:13px 14px;background-image:none" />

    <button class="wm-start-btn" onclick="wmStart()">
      <span class="wm-start-btn-icon">▶</span> Deep Work starten
    </button>

    <div class="wm-section-label">Heute · ${today.completed} ✓ abgeschlossen</div>
    ${historyHtml}
  `;
}

window.wmSetDuration = function(min) {
  _wmConfig.durationMin = min;
  wmSavePrefs();
  render();
};

window.wmSetCustomDuration = function(val) {
  const n = parseInt(val, 10);
  if (isNaN(n) || n < 1) return;
  _wmConfig.durationMin = Math.min(240, n);
  wmSavePrefs();
  render();
};

window.wmSetTask = function(id) {
  _wmConfig.taskId = id || '';
  wmSavePrefs();
};

window.wmStart = function() {
  if (_wmActive) return;
  const task = _wmConfig.taskId ? getTasks().find(t => t.id === _wmConfig.taskId) : null;
  _wmActive = {
    startedAt: Date.now(),
    durationMs: _wmConfig.durationMin * 60 * 1000,
    taskId: _wmConfig.taskId || '',
    taskTitle: task ? (task.title || '') : '',
    sessionName: _wmConfig.sessionName || 'Deep Work',
    pausedAt: null,
    pausedTotalMs: 0,
  };
  wmRequestWakeLock();
  wmShowFocus();
  wmStartTicker();
};

function wmStartTicker() {
  if (_wmTicker) clearInterval(_wmTicker);
  wmTick();
  _wmTicker = setInterval(wmTick, 250);
}

function wmTick() {
  if (!_wmActive) return;
  const now = Date.now();
  const isPaused = !!_wmActive.pausedAt;
  const elapsed = (isPaused ? _wmActive.pausedAt : now) - _wmActive.startedAt - _wmActive.pausedTotalMs;
  const remaining = _wmActive.durationMs - elapsed;

  const timerEl = document.getElementById('wmFocusTimer');
  if (timerEl) {
    timerEl.textContent = wmFormatMs(remaining);
    timerEl.classList.toggle('paused', isPaused);
  }

  const elapsedEl = document.getElementById('wmFocusElapsed');
  if (elapsedEl) {
    const elapsedMin = Math.floor(elapsed / 60000);
    elapsedEl.textContent = (isPaused ? '⏸ Pausiert · ' : '') + elapsedMin + ' Min fokussiert';
  }

  if (remaining <= 0 && !isPaused) {
    wmStopFocus(true);
  }
}

function wmShowFocus() {
  const focus = document.getElementById('wmFocus');
  if (!focus || !_wmActive) return;
  focus.classList.add('active');

  const sub = document.getElementById('wmFocusSub');
  if (sub) sub.textContent = _wmActive.sessionName || 'Fokussiere dich';

  const taskEl = document.getElementById('wmFocusTask');
  if (taskEl) {
    if (_wmActive.taskTitle) {
      taskEl.textContent = '📌 ' + _wmActive.taskTitle;
      taskEl.style.display = 'block';
    } else {
      taskEl.style.display = 'none';
    }
  }

  const pauseBtn = document.getElementById('wmFocusPause');
  if (pauseBtn) pauseBtn.textContent = _wmActive.pausedAt ? '▶ Weiter' : '⏸ Pause';

  wmTick();
}

window.wmTogglePause = function() {
  if (!_wmActive) return;
  if (_wmActive.pausedAt) {
    // Resume
    _wmActive.pausedTotalMs += Date.now() - _wmActive.pausedAt;
    _wmActive.pausedAt = null;
    wmRequestWakeLock();
  } else {
    _wmActive.pausedAt = Date.now();
    wmReleaseWakeLock();
  }
  const pauseBtn = document.getElementById('wmFocusPause');
  if (pauseBtn) pauseBtn.textContent = _wmActive.pausedAt ? '▶ Weiter' : '⏸ Pause';
  wmTick();
};

window.wmStopFocus = function(completed) {
  if (!_wmActive) return;
  const now = Date.now();
  const effectivePausedMs = _wmActive.pausedTotalMs + (_wmActive.pausedAt ? (now - _wmActive.pausedAt) : 0);
  const actualMs = Math.max(0, now - _wmActive.startedAt - effectivePausedMs);

  const session = {
    id: 'wm_' + Date.now().toString(36),
    startedAt: new Date(_wmActive.startedAt).toISOString(),
    endedAt: new Date(now).toISOString(),
    dateYmd: todayYmd(new Date(_wmActive.startedAt)),
    plannedMs: _wmActive.durationMs,
    actualMs,
    pausedMs: effectivePausedMs,
    taskId: _wmActive.taskId,
    taskTitle: _wmActive.taskTitle,
    sessionName: _wmActive.sessionName,
    completed: !!completed,
  };
  const sessions = wmGetSessions();
  sessions.push(session);
  wmSaveSessions(sessions);

  // ─── In Quantus Zeit-Tracker schreiben ───────────────────────────
  // Mind. 10s Netto-Arbeitszeit, damit versehentliche Starts nicht zu
  // Müll-Einträgen führen.
  if (actualMs >= 10000 && typeof performOp === 'function' && _data) {
    try {
      const sessionLabel = _wmActive.sessionName && _wmActive.sessionName !== 'Deep Work'
        ? 'Deep Work · ' + _wmActive.sessionName
        : 'Deep Work';
      const teId = 'te_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const nowIso = new Date(now).toISOString();
      performOp({
        type: 'add-time-entry',
        payload: {
          id: teId,
          createdAt: nowIso,
          updatedAt: nowIso,
          taskId: _wmActive.taskId || null,
          startTs: new Date(_wmActive.startedAt).toISOString(),
          endTs: nowIso,
          durationSec: Math.floor(actualMs / 1000),
          note: sessionLabel,
          billable: false,
          source: 'mobile-workmode',
        },
      });
    } catch(e) { console.warn('Time-entry sync failed:', e); }
  }

  if (_wmTicker) { clearInterval(_wmTicker); _wmTicker = null; }
  wmReleaseWakeLock();

  const focus = document.getElementById('wmFocus');
  if (focus) focus.classList.remove('active');

  if (completed) {
    // Completion-Overlay
    const comp = document.getElementById('wmComplete');
    const stat = document.getElementById('wmCompleteStat');
    const sub = document.getElementById('wmCompleteSub');
    if (stat) stat.textContent = wmFormatHumanMin(Math.round(actualMs / 60000));
    if (sub) sub.textContent = _wmActive.taskTitle
      ? 'Gut gemacht: "' + _wmActive.taskTitle + '"'
      : 'Starke Arbeit. Gönn dir kurz Pause.';
    if (comp) comp.classList.add('active');
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 240]); } catch(e) {}
    if (typeof toast === 'function') toast('Session abgeschlossen ⚡ — in Quantus erfasst', 'ok');
  } else {
    if (typeof toast === 'function') {
      if (actualMs < 10000) toast('Abgebrochen — zu kurz für Erfassung', 'warn');
      else if (actualMs > 60000) toast('Session gestoppt — in Quantus erfasst', 'ok');
      else toast('Session gestoppt', 'ok');
    }
  }

  _wmActive = null;
  render();
};

window.wmCloseComplete = function() {
  const comp = document.getElementById('wmComplete');
  if (comp) comp.classList.remove('active');
};

async function wmRequestWakeLock() {
  try {
    if (_wmWakeLock) return;
    if (navigator.wakeLock && navigator.wakeLock.request) {
      _wmWakeLock = await navigator.wakeLock.request('screen');
      _wmWakeLock.addEventListener('release', () => { _wmWakeLock = null; });
    }
  } catch(e) { console.warn('WakeLock failed:', e); }
}

function wmReleaseWakeLock() {
  try {
    if (_wmWakeLock) {
      _wmWakeLock.release();
      _wmWakeLock = null;
    }
  } catch(e) {}
}

// Re-acquire WakeLock wenn Tab wieder sichtbar wird
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && _wmActive && !_wmActive.pausedAt && !_wmWakeLock) {
    wmRequestWakeLock();
  }
});

window.editBlobKey = function() {
  const current = getBlobKey();
  const newKey = prompt('Blob-Key (der Dateiname im Storage, normalerweise "app-data.json"):', current);
  if (newKey === null) return;
  const cleaned = newKey.trim();
  if (!cleaned || cleaned === DEFAULT_BLOB_KEY) {
    localStorage.removeItem(BLOB_KEY_OVERRIDE_KEY);
    toast('Auf Standard zurückgesetzt', 'ok');
  } else {
    localStorage.setItem(BLOB_KEY_OVERRIDE_KEY, cleaned);
    toast('Blob-Key gespeichert', 'ok');
  }
  _initialPullDone = false;
  _initialPullStatus = 'pending';
  pullData(false);
};

window.resetSyncConfig = function() {
  if (!confirm('Server-URL und Blob-Key auf Standard zurücksetzen?')) return;
  localStorage.removeItem(BASE_URL_OVERRIDE_KEY);
  localStorage.removeItem(BLOB_KEY_OVERRIDE_KEY);
  _initialPullDone = false;
  _initialPullStatus = 'pending';
  pullData(false);
  toast('Zurückgesetzt', 'ok');
};

window.runSyncTest = async function() {
  const out = document.getElementById('syncTestOutput');
  if (!out) return;
  const base = getBaseUrl();
  const key = getBlobKey();
  const url = base + '/.netlify/functions/blob-get?key=' + encodeURIComponent(key) + '&_ts=' + Date.now();

  out.innerHTML = `<div class="more-section" style="margin-top:16px;padding:14px">
    <div style="font-size:13px;font-weight:700;color:#a5b4fc;margin-bottom:8px">🧪 Verbindungstest läuft…</div>
    <div style="font-size:11px;color:#71717a;font-family:'SF Mono',Menlo,monospace;word-break:break-all">${escHTML(url)}</div>
  </div>`;

  try {
    const t0 = Date.now();
    const r = await fetch(url, { method: 'GET', cache: 'no-store' });
    const dt = Date.now() - t0;
    const text = await r.text();
    let parsedInfo = '';
    let counts = { tasks: 0, notes: 0, ideas: 0 };
    let metaInfo = '';
    if (r.ok) {
      try {
        const obj = JSON.parse(text);
        counts.tasks = Object.keys(obj?.entities?.tasks || {}).length;
        counts.notes = Object.keys(obj?.entities?.notes || {}).length;
        counts.ideas = Object.keys(obj?.entities?.ideas || {}).length;
        metaInfo = obj?.meta ? `<div>updatedAt: <strong>${escHTML(obj.meta.updatedAt || '—')}</strong></div><div>lastSavedBy: <strong>${escHTML(obj.meta.lastSavedBy || '—')}</strong></div>` : '<div style="color:#fbbf24">⚠ Kein meta-Objekt im Response</div>';
        parsedInfo = `<div style="margin-top:8px"><strong>Inhalt:</strong> ${counts.tasks} Tasks · ${counts.notes} Notes · ${counts.ideas} Ideen</div>${metaInfo}`;
        if (counts.tasks === 0 && counts.notes === 0 && counts.ideas === 0) {
          parsedInfo += '<div style="margin-top:10px;padding:10px;background:rgba(245,158,11,0.10);border-left:3px solid #fbbf24;border-radius:6px;font-size:11.5px;line-height:1.5;color:#fbbf24"><strong>⚠ Server liefert leere Daten.</strong><br>Quantus pusht offenbar an eine andere URL/einen anderen Blob-Key. Geh in Quantus → Einstellungen → Sync und setze GET/PUT URL auf:<br><code style="display:block;margin-top:6px;padding:6px;background:rgba(0,0,0,0.3);border-radius:4px;font-size:10.5px;word-break:break-all">' + escHTML(base) + '/.netlify/functions/blob-get?key={key}</code><div style="margin-top:4px">Blob-Key: <strong>' + escHTML(key) + '</strong></div></div>';
        }
      } catch(e) {
        parsedInfo = '<div style="color:#f87171">⚠ Antwort ist kein gültiges JSON: ' + escHTML(e.message) + '</div>';
      }
    }
    const statusColor = r.ok ? '#4ade80' : (r.status === 404 ? '#fbbf24' : '#f87171');
    out.innerHTML = `<div class="more-section" style="margin-top:16px;padding:14px;font-size:12px;color:#e4e4e7;line-height:1.6">
      <div style="font-size:13px;font-weight:700;color:${statusColor};margin-bottom:10px">${r.ok ? '✓' : (r.status === 404 ? '⚠' : '✗')} HTTP ${r.status} · ${dt} ms · ${(text.length/1024).toFixed(1)} KB</div>
      <div style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:#71717a;word-break:break-all;margin-bottom:10px">${escHTML(url)}</div>
      ${parsedInfo || `<div style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:#a1a1aa;max-height:140px;overflow:auto;background:rgba(0,0,0,0.3);padding:8px;border-radius:6px;white-space:pre-wrap">${escHTML(text.slice(0, 600))}</div>`}
    </div>`;
  } catch(err) {
    out.innerHTML = `<div class="more-section" style="margin-top:16px;padding:14px;color:#f87171">
      <div style="font-weight:700;margin-bottom:6px">✗ Netzwerk-Fehler</div>
      <div style="font-size:12px;color:#fca5a5">${escHTML(err.message || String(err))}</div>
      <div style="font-size:11px;color:#a1a1aa;margin-top:8px">Mögliche Ursachen: Server offline · CORS · Domain falsch · keine Internet-Verbindung</div>
    </div>`;
  }
};

function greetingTitle() {
  const h = new Date().getHours();
  if (h < 5) return 'Späte Stunde';
  if (h < 11) return 'Guten Morgen';
  if (h < 14) return 'Guten Mittag';
  if (h < 18) return 'Guten Nachmittag';
  if (h < 22) return 'Guten Abend';
  return 'Späten Abend';
}

function getJournalUnreadCount() {
  if (!_data?.mobilePushes) return 0;
  const pushes = Array.isArray(_data.mobilePushes) ? _data.mobilePushes : [];
  const lastRead = parseInt(localStorage.getItem('qc-mobile-journal-lastread') || '0', 10);
  return pushes.filter(p => new Date(p.timestamp || 0).getTime() > lastRead).length;
}

window.pdSetStatus = function(id, status) {
  const pd = getPurchaseDecisions().find(d => d.id === id);
  if (!pd) return;
  const updated = { ...pd, status, updatedAt: new Date().toISOString() };
  if (status === 'purchased') updated.purchasedAt = new Date().toISOString();
  if (status === 'approved' || status === 'rejected') updated.decidedAt = new Date().toISOString();
  performOp({ type: 'update-purchase-decision', payload: updated });
  toast(status === 'approved' ? 'Genehmigt ✓' : status === 'rejected' ? 'Abgelehnt' : status === 'purchased' ? 'Als gekauft markiert' : 'Aktualisiert', 'ok');
};

window.pdDelete = function(id) {
  if (!confirm('Diesen Kaufentscheid löschen?')) return;
  performOp({ type: 'delete-purchase-decision', payload: { id } });
  toast('Gelöscht', 'ok');
};

// ── Passwords ─────────────────────────────────────────────────────────
function getPasswords() {
  if (!_data?.entities?.passwords) return [];
  return Object.values(_data.entities.passwords).filter(p => !p.deleted);
}

window.pwdToggleReveal = function(id) {
  if (_pwdRevealed.has(id)) _pwdRevealed.delete(id);
  else _pwdRevealed.add(id);
  render();
};

window.pwdCopy = async function(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast((label || 'Kopiert') + ' · in 30s gelöscht', 'ok');
    setTimeout(async () => {
      try { const cur = await navigator.clipboard.readText(); if (cur === text) await navigator.clipboard.writeText(''); } catch(e) {}
    }, 30000);
  } catch(e) { toast('Kopieren fehlgeschlagen', 'error'); }
};

window.pwdSetSearch = function(v) {
  _pwdSearch = (v || '').toLowerCase();
  const list = document.getElementById('pwdList');
  if (list) list.innerHTML = renderPasswordsList();
};

function renderPasswordsList() {
  const all = getPasswords()
    .filter(p => !_pwdSearch || (p.title || '').toLowerCase().includes(_pwdSearch) || (p.username || '').toLowerCase().includes(_pwdSearch))
    .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  if (all.length === 0) {
    return `<div class="empty"><div class="empty-icon">🔐</div>
      <div class="empty-title">${_pwdSearch ? 'Nichts gefunden' : 'Keine Einträge'}</div>
      <div class="empty-sub">${_pwdSearch ? 'Anderen Suchbegriff versuchen.' : 'Tippe + um einen Eintrag hinzuzufügen.'}</div></div>`;
  }
  return all.map(p => {
    const initial = (p.title || '?').charAt(0).toUpperCase();
    const revealed = _pwdRevealed.has(p.id);
    const escPwd = JSON.stringify(p.password || '');
    const escUser = JSON.stringify(p.username || '');
    return `<div class="pwd-card">
      <div class="pwd-card-emoji">${escHTML(initial)}</div>
      <div class="pwd-card-body" onclick="pwdOpenSheet('${p.id}')">
        <div class="pwd-card-title">${escHTML(p.title || 'Unbenannt')}</div>
        <div class="pwd-card-user">${revealed && p.password ? escHTML(p.password) : '•••••••• ' + escHTML(p.username || '')}</div>
      </div>
      <div class="pwd-card-actions">
        ${p.username ? `<button class="pwd-mini-btn" onclick='pwdCopy(${escUser}, "Benutzername")'>👤</button>` : ''}
        <button class="pwd-mini-btn" onclick='pwdCopy(${escPwd}, "Passwort")'>📋</button>
        <button class="pwd-mini-btn" onclick="pwdToggleReveal('${p.id}')">${revealed ? '🙈' : '👁'}</button>
      </div>
    </div>`;
  }).join('');
}

window.pwdGenerateMobile = function() {
  const length = 20;
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*-_=+';
  const buf = new Uint32Array(length);
  crypto.getRandomValues(buf);
  let out = '';
  for (let i = 0; i < length; i++) out += chars[buf[i] % chars.length];
  return out;
};

// ── AI Chat ───────────────────────────────────────────────────────────
function getChats() {
  if (!_data?.aiChats || !Array.isArray(_data.aiChats)) return [];
  return _data.aiChats.filter(c => !c.deleted).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
}

function renderAiChat() {
  let html = subHeader('KI Chat', '💬');

  const chats = getChats();
  if (!_currentChatId && chats.length > 0) _currentChatId = chats[0].id;
  const currentChat = chats.find(c => c.id === _currentChatId) || chats[0];

  if (chats.length === 0) {
    html += `<div class="empty"><div class="empty-icon">💬</div>
      <div class="empty-title">Noch kein Chat</div>
      <div class="empty-sub">Erstelle einen Chat in Quantus — oder schreibe unten deine erste Nachricht.</div></div>`;
    html += `<div class="ai-input-bar">
      <input type="text" class="ai-input" id="aiInput" placeholder="Schreibe eine Nachricht…" onkeydown="if(event.key==='Enter')aiChatSend()" />
      <button class="ai-send-btn" onclick="aiChatSend()">Senden</button>
    </div>`;
    return html;
  }

  html += `<div style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px">`;
  chats.slice(0, 10).forEach(c => {
    const active = c.id === _currentChatId;
    const title = (c.title || 'Chat').slice(0, 20);
    html += `<button class="filter-chip ${active?'active':''}" onclick="aiSelectChat('${c.id}')">${escHTML(title)}</button>`;
  });
  html += `</div>`;

  const messages = currentChat?.messages || [];
  html += '<div class="ai-chat-list" style="display:flex;flex-direction:column">';
  if (messages.length === 0) {
    html += '<div style="text-align:center;color:#52525b;font-size:13px;padding:30px">Noch keine Nachrichten in diesem Chat.</div>';
  } else {
    messages.slice(-50).forEach(m => {
      const ts = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : '';
      html += `<div class="ai-msg ${m.role === 'user' ? 'user' : 'assistant'}">${escHTML(m.content || '')}<div class="ai-msg-meta">${ts}</div></div>`;
    });
  }
  html += '</div>';

  html += `<div class="ai-input-bar">
    <input type="text" class="ai-input" id="aiInput" placeholder="Schreibe eine Nachricht…" onkeydown="if(event.key==='Enter')aiChatSend()" />
    <button class="ai-send-btn" onclick="aiChatSend()">Senden</button>
  </div>`;
  return html;
}

window.aiSelectChat = function(id) { _currentChatId = id; render(); };

window.aiChatFocusInput = function() {
  setTimeout(() => { const el = document.getElementById('aiInput'); if (el) el.focus(); }, 60);
};

window.aiChatSend = function() {
  const input = document.getElementById('aiInput');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  if (!_currentChatId) {
    // Erstelle neuen Chat
    const newId = 'chat_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    _currentChatId = newId;
    performOp({
      type: 'add-chat',
      payload: {
        id: newId,
        title: text.slice(0, 40),
        messages: [{ role: 'user', content: text, timestamp: new Date().toISOString() }],
        pinned: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      }
    });
  } else {
    performOp({
      type: 'add-chat-message',
      payload: {
        chatId: _currentChatId,
        message: { role: 'user', content: text, timestamp: new Date().toISOString() }
      }
    });
  }
};

// ── Custom Sheet Helpers ──────────────────────────────────────────────
function openCustomSheet(title, fieldsHtml, onSubmit) {
  const sheet = document.getElementById('sheet');
  const overlay = document.getElementById('sheetOverlay');
  const body = document.getElementById('sheetBody');
  const titleEl = document.getElementById('sheetTitle');
  if (!sheet || !body) return;
  if (titleEl) titleEl.textContent = title;
  body.innerHTML = fieldsHtml;
  _customSheetSubmit = onSubmit;
  _sheetMode = 'custom';
  overlay.classList.add('open');
  sheet.classList.add('open');
}

// ── applyOp Erweiterungen (für neue op-types) ────────────────────────
const _origApplyOp = applyOp;
applyOp = function(op) {
  if (!_data.entities) _data.entities = {};
  ['passwords','purchaseDecisions','transactions','goals'].forEach(k => {
    if (!_data.entities[k]) _data.entities[k] = {};
  });
  if (!_data.aiChats) _data.aiChats = [];
  const E = _data.entities;

  if (op.type === 'add-password' || op.type === 'update-password') {
    E.passwords[op.payload.id] = op.payload;
    return;
  }
  if (op.type === 'delete-password') { delete E.passwords[op.payload.id]; return; }

  if (op.type === 'add-purchase-decision' || op.type === 'update-purchase-decision') {
    E.purchaseDecisions[op.payload.id] = op.payload;
    return;
  }
  if (op.type === 'delete-purchase-decision') { delete E.purchaseDecisions[op.payload.id]; return; }

  if (op.type === 'add-chat') {
    _data.aiChats.unshift(op.payload);
    return;
  }
  if (op.type === 'add-chat-message') {
    const chat = _data.aiChats.find(c => c.id === op.payload.chatId);
    if (chat) {
      chat.messages = chat.messages || [];
      chat.messages.push(op.payload.message);
      chat.updatedAt = new Date().toISOString();
    }
    return;
  }

  // Fallback an existierende Logik (tasks, notes, ideas, time-entry)
  _origApplyOp(op);
};

init();
