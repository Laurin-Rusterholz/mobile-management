<!DOCTYPE html>
<html lang="de" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-content: wo der Browser es kennt (Chrome,
       neuere Safari), schrumpft die Tastatur das Layout-Fenster selbst und
       100dvh stimmt wieder. Wo nicht, rechnet js/views/polaris.js es aus. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Quantus</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#171c20">
  <meta name="description" content="Quantus — persönliche Super-App für Aufgaben, Projekte, Fokus, Notizen, Gewohnheiten, Budget und mehr.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quantus">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

  <!-- Theme pre-paint (FOUC-frei), kompatibel mit ai-sync quantus_themeMode -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('quantus_themeMode') || 'dark';
        var light = mode === 'light' || (mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        var r = document.documentElement;
        r.classList.toggle('theme-light', light);
        r.classList.toggle('theme-dark', !light);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/apps.css">

  <!-- Firebase (nur Storage-Download-URLs für Anhänge; identisch zur Hauptapp) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <!-- Die App traegt eine eigene Google-Anmeldung (js/auth.js): eine
       Firebase-Sitzung gilt pro Origin, und dieser Origin ist nicht der der
       Hauptapp. database-compat wird fuer careerModel/users/<uid> gebraucht. -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <div class="boot-orb">◐</div>
      <div class="boot-label">Quantus wird geladen…</div>
    </div>
  </div>

  <style>
    .boot { position: fixed; inset: 0; display: grid; place-items: center; gap: 10px; }
    .boot-orb { font-size: 48px; color: var(--accent); animation: spin 2s linear infinite; }
    .boot-label { color: var(--text-muted); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
